<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERV EVA Timer</title>
    <link rel="stylesheet" href="fonts.css">
    <script defer src="js/resources.js"></script>
    <script defer src="js/svgui.js"></script>
    <script defer src="js/timer.js"></script>
    <script defer src="js/eva-timer.js"></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #parent {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #timer, #settings {
            position: absolute;
            inset: 0;
        }

        #timer {
            z-index: 0;
            pointer-events: auto;
        }

        #settings {
            z-index: 1;
            pointer-events: none;
        }

        #timer > div,
        #settings > div {
            width: 100%;
            height: 100%;
        }

        svg {
            display: block;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            pointer-events: auto;
        }

        #debug-panel {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 9999;
            padding: 12px 14px;
            background: rgba(20, 20, 20, 0.92);
            color: #ff6b6b;
            border: 1px solid #8a1f1f;
            font: 14px/1.4 monospace;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="timer"></div>
        <div id="settings"></div>
    </div>
    <div id="debug-panel"></div>
    <script>
        (function () {
            function setDebug(message) {
                var panel = document.getElementById('debug-panel');
                if (!panel) {
                    return;
                }
                panel.style.display = message ? 'block' : 'none';
                panel.textContent = message || '';
            }

            function formatError(prefix, error) {
                if (!error) {
                    return prefix;
                }
                if (error && error.stack) {
                    return prefix + '\n' + error.stack;
                }
                if (error && error.message) {
                    return prefix + '\n' + error.message;
                }
                return prefix + '\n' + String(error);
            }

            window.__setEvaDebug = setDebug;
            window.addEventListener('error', function (event) {
                setDebug(formatError('Runtime error', event.error || event.message));
            });
            window.addEventListener('unhandledrejection', function (event) {
                setDebug(formatError('Promise error', event.reason));
            });

            window.addEventListener('DOMContentLoaded', function () {
                setDebug('Loading EVA Timer...');
                if (!window.initEvaTimer) {
                    setDebug('initEvaTimer is not available');
                    return;
                }
                Promise.resolve(window.initEvaTimer()).then(function () {
                    window.setTimeout(function () {
                        if (document.querySelector('svg')) {
                            setDebug('');
                        } else {
                            setDebug('Initialization finished but SVG was not rendered');
                        }
                    }, 800);
                }).catch(function (error) {
                    setDebug(formatError('Initialization failed', error));
                });
            });
        })();
    </script>
</body>
</html>
