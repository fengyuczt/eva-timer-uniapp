<div class="settings-panel" style="background-color: black; color: white; font-family: sans-serif; padding: 12px 0;">
    <style>
        .settings-panel h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        .settings-divider {
            background-color: red;
            height: 5px;
            border: 0;
            margin: 14px 0;
        }

        .settings-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            font-size: 18px;
        }

        .settings-field input[type="text"] {
            width: 96px;
            padding: 8px 10px;
            font-size: 18px;
            box-sizing: border-box;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 16px;
            padding: 8px 0 2px;
        }

        .settings-grid .settings-field {
            padding: 0;
        }

        .settings-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            font-size: 18px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .settings-option input[type="radio"],
        .settings-option input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin: 0;
            flex: 0 0 auto;
        }

        .settings-actions {
            padding-top: 6px;
        }

        .settings-actions button {
            min-width: 108px;
            padding: 10px 18px;
            font-size: 18px;
        }
    </style>
    <h1>&#35774;&#32622; (S)</h1>
    <hr class="settings-divider">
    <form>
        <div class="settings-field">
            <label for="duration">&#27963;&#21160;&#26102;&#38271;:</label>
            <input type="text" id="duration" name="duration" value="05:00">
        </div>
        <div class="settings-field">
            <label for="emergency_duration">&#32039;&#24613;&#26102;&#38271;:</label>
            <input type="text" id="emergency_duration" name="emergency_duration" value="01:00">
        </div>
        <div class="settings-grid">
            <div class="settings-field">
                <label for="crop_left">Crop L:</label>
                <input type="text" id="crop_left" name="crop_left" value="235">
            </div>
            <div class="settings-field">
                <label for="crop_right">Crop R:</label>
                <input type="text" id="crop_right" name="crop_right" value="0">
            </div>
            <div class="settings-field">
                <label for="crop_top">Crop T:</label>
                <input type="text" id="crop_top" name="crop_top" value="0">
            </div>
            <div class="settings-field">
                <label for="crop_bottom">Crop B:</label>
                <input type="text" id="crop_bottom" name="crop_bottom" value="0">
            </div>
        </div>
        <hr class="settings-divider">
        <label class="settings-option">
            <input type="radio" id="countdown" name="timer" value="0" checked>
            <span>&#20498;&#35745;&#26102; (R)</span>
        </label>
        <label class="settings-option">
            <input type="radio" id="countup" name="timer" value="1">
            <span>&#27491;&#35745;&#26102; (R)</span>
        </label>
        <label class="settings-option">
            <input type="radio" id="systemtime" name="timer" value="2">
            <span>&#24403;&#21069;&#26102;&#38388; (R)</span>
        </label>
        <hr class="settings-divider">
        <label class="settings-option">
            <input type="checkbox" id="fullscreen" name="fullscreen">
            <span>&#20840;&#23631;&#26174;&#31034; (F)</span>
        </label>
        <label class="settings-option">
            <input type="radio" id="theme_default" name="theme" checked>
            <span>&#40664;&#35748;&#26174;&#31034;</span>
        </label>
        <label class="settings-option">
            <input type="radio" id="greyscale" name="theme">
            <span>&#28784;&#24230;&#27169;&#24335; (G)</span>
        </label>
        <label class="settings-option">
            <input type="radio" id="wireframe" name="theme">
            <span>&#32447;&#26694;&#27169;&#24335; (W)</span>
        </label>
        <label class="settings-option">
            <input type="radio" id="rebuild" name="theme">
            <span>&#26032;&#21195;&#22330;&#29256;&#20027;&#39064; (T)</span>
        </label>
        <hr class="settings-divider">
        <label class="settings-option">
            <input type="checkbox" id="autoplay" name="autoplay">
            <span>&#33258;&#21160;&#25773;&#25918;</span>
        </label>
        <hr class="settings-divider">
        <div class="settings-actions">
            <button id="ok" type="button">&#30830;&#23450;</button>
        </div>
    </form>
</div>
